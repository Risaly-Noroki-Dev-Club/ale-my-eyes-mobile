[package]
name = "ale-core"
version = "0.3.0"
edition = "2021"
description = "Portable encrypted remote-session core for Ale, My Eyes! Android"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
base64 = "0.22"
futures-util = "0.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[features]
mock-server = []

[[example]]
name = "mock_remote_v2"
required-features = ["mock-server"]
